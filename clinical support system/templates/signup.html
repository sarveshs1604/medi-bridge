<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 400px; margin: auto; }
        h1 { text-align: center; }
        form { display: flex; flex-direction: column; }
        .form-group { margin-bottom: 15px; }
        label { margin-bottom: 5px; font-weight: bold; }
        input { border-radius: 20px; width: 100%; padding: 8px; box-sizing: border-box; }
        button { border-radius: 20px; padding: 10px 20px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .error { color: red; text-align: center; margin-bottom: 10px; }
        body{background-image: url('https://t4.ftcdn.net/jpg/02/45/97/31/360_F_245973186_TePEtIgMgf38IJA8yUFuwh3q1SSoZEbs.jpg');
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-size:100% 100%;
        background-color: rgb(34, 34, 34);
        opacity: 100;}
    </style>
</head>
<body>
    <div class="container">
        <h1>Sign Up</h1>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form action="{{url_for('signup')}}" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
            <button type="submit">Sign Up</button>
        </form>
    </div>
</body>
</html>
