{% extends 'base.html' %}
{% block content %}
<h2>Edit Doctor</h2>
<style>
    body{background-image: url('https://thumbs.dreamstime.com/b/doctor-hospital-corridor-unfocused-background-77263373.jpg ');
    background-repeat: no-repeat;
    background-attachment: fixed;
    background-size:100% 100%;
    background-color: rgb(34, 34, 34);
    opacity: 0.85;}
    /* filter: opacity(0.5);} */

</style>
<form action="{{ url_for('edit_doctor', id=doctor['id'] if doctor is mapping else doctor[0]) }}" method="post">
    <input type="text" name="name" value="{{ doctor[1] }}" required>
    <input type="text" name="specialty" value="{{ doctor[2] }}" required>
    <input type="text" name="contact" value="{{ doctor[3] }}" required>
    <button type="submit" class="btn btn-dark">Update Doctor</button>
</form>
{% endblock %}`
