{% extends 'base.html' %}
{% block content %}
<h2>Edit Appointment</h2>
<style>
    body{background-image: url('https://us.123rf.com/450wm/sudok1/sudok11808/sudok1180800020/109324271-blurred-hospital-room-with-the-several-beds-separated-by-a-screen-unfocused-background.jpg?ver=6 ');
    background-repeat: no-repeat;
    background-attachment: fixed;
    background-size:100% 100%;
    background-color: rgb(34, 34, 34);
    opacity: 0.85;}
    /* filter: opacity(0.5);} */

</style>
<form action="{{ url_for('edit_appointment', id=appointment['id'] if appointment is mapping else appointment[0]) }}" method="POST">
    <label for="patient_id">Patient id:</label>
    <input type="number" id="patient_id" name="patient_id" value="{{ appointment.patient_id }}" required><br><br>

    <label for="doctor_id">Doctor ID:</label>
    <input type="number" id="doctor_id" name="doctor_id" value="{{ appointment.doctor_id}}" required><br><br>

    <label for="date">Appointment Date:</label>
    <input type="date" id="date" name="date" value="{{ appointment.date }}" required><br><br>

    <label for="time">Appointment Time:</label>
    <input type="time" id="time" name="time" value="{{ appointment.time }}" required><br><br>

    <button type="submit" class="btn btn-dark">Update Appointment</button>
</form>
{% endblock %}
